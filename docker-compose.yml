version: "3.8"

services:
  migration:
    build:
      dockerfile: deploy/Dockerfile.migration

  app:
    build:
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - migration
      - redis
      - postgres

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: minitest
    ports:
      - "5432:5432"